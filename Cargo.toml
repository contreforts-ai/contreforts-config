[package]
name = "contreforts-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Configuration's own Oxigraph store and datadir, separate from contreforts-kg"

[features]
# Off by default: this crate's own store is pure in-memory + on-disk file persistence (see
# `src/persistence.rs`) and needs no RocksDB. This feature exists only for
# `migration::migrate_config_graph_if_needed`, which opens a *pre-existing* combined
# contreforts-kg store -- itself RocksDB-backed -- to copy hand-entered configuration out of it
# exactly once. A binary that still has environments needing that one-time copy enables this
# explicitly; every other consumer never pulls the `oxrocksdb-sys` native/C++ build dependency
# in at all.
legacy-combined-store-migration = ["oxigraph/rocksdb"]

[dependencies]
# The store itself -- contreforts-workspace#18's design gives configuration its
# own Oxigraph runtime, independent of contreforts-kg's. Not `{ workspace = true }`: the
# workspace's own `oxigraph = "0.5"` entry doesn't disable oxigraph's default `rocksdb` feature
# (Cargo forbids a dependent overriding `default-features` unless the workspace entry itself
# sets `default-features = false`), and this crate has been asked to stop shipping that
# dependency -- `ConfigStore` opens no RocksDB-backed `Store` anywhere (see `src/persistence.rs`).
# Pinned to the same "0.5" the workspace uses, with RocksDB off outright rather than merely
# optional.
oxigraph = { version = "0.5", default-features = false }
# Named error for an unusable store path (contreforts-workspace#58 D2) -- no
# panic, no silent fallback to a temp or current directory.
thiserror = { workspace = true }
# Per-user OS data directory, mirroring the mechanism contreforts-core's
# GraphConfig::from_env already uses (crates/contreforts-core/src/config.rs) --
# same precedence, different leaf directory so the two stores never collide.
dirs = { workspace = true }
# contreforts/contreforts-workspace#58 (comment 7904), item D3c: the ported
# engine's `ConnectorConfig` structs are (de)serializable, exactly as they are
# in `contreforts-kg::config_graph` today -- config-api's JSON API is what
# they exist for.
serde = { workspace = true }
# The engine's own vocabulary (`CONFIG_GRAPH`, `CORE_NS`, `company_iri`,
# `connector_iri`, ...) lives here since D3b (contreforts/contreforts-workspace#58,
# comment 7833) -- neither store crate depends on the other for it.
contreforts-core = { workspace = true }
# Percent-encoding a KG instance's label into its own definition-record subject IRI
# (contreforts-workspace#58 D4), matching every other label-scoped IRI builder in
# `contreforts-core::namespaces`.
urlencoding = { workspace = true }
# contreforts/contreforts-workspace#58 (comment 7791), item D3a: server-side
# SHACL validation of connector writes lives below both store crates. Not
# `{ workspace = true }`: this crate is not in the root workspace's
# `[workspace.dependencies]` table (see its own manifest's comment on why it
# must stand on its own even outside this superproject) -- same explicit-path
# shape `contreforts-kg`'s own manifest already uses for this dependency.
contreforts-declaration = { path = "../contreforts-core/declaration" }
# `migration::migrate_config_graph_if_needed` logs at `info` on the one path that genuinely
# needs to be loud -- the real, one-time copy of hand-entered configuration out of the combined
# store (contreforts-workspace#58, D8 part 2a) -- and stays silent on every no-op path. Same
# crate every other logging call site in the workspace already uses (e.g.
# `contreforts-kg/src/orchestrator.rs`).
tracing = { workspace = true }

[dev-dependencies]
# Isolated per-test temp directories: the store-open and datadir tests need
# real filesystem paths (an in-memory store can't pin "own datadir" or
# "unusable path" behaviour), and tempfile keeps each test's directory unique
# and self-cleaning. Same pin shape as contreforts-code's own dev-dependency
# on this crate.
tempfile = "3"
# `admin_url_is_write_only`-style regression: the DDL credential must not
# survive serialization, which is a stronger guarantee than checking the
# struct field alone. Dev-only -- no production code in this crate serializes
# to JSON itself.
serde_json = { workspace = true }
